<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic Expert Advisor</title>
<meta name="description" content="The project page of the Diagnostic Expert Advisor is under construction.">
<meta name="robots" content="noindex">
<style>
  :root { --bg: #0b0d12; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --accent: #5b8def; --border: rgba(255,255,255,.1); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px; }
  main { max-width: 520px; text-align: center; }
  .mark { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 22px; background: linear-gradient(135deg, #5b8def, #8b7cf6 60%, #4fd1c5); position: relative; }
  .mark::after { content: ""; position: absolute; inset: 15px; border-radius: 8px; background: var(--bg); opacity: .85; }
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 10px; }
  p { color: var(--ink-2); margin: 0 0 8px; }
  .small { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill { display: inline-block; margin-bottom: 18px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <div class="pill">Under construction</div>
  <h1>Diagnostic Expert Advisor</h1>
  <p>A lightweight toolkit for working with clinical time series. The project page is being finalized and will be online soon.</p>
  <p class="small">The code and the documentation are on <a href="https://github.com/DeastinY/diagnostic-expert-advisor">GitHub</a>.</p>
</main>
</body>
</html>
