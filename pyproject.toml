[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dea"
version = "2.0.0a2"
description = "Diagnostic Expert Advisor: ingest, profile, visualize and analyze clinical time-series cohorts"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "Richard Polzin" }]
keywords = ["clinical", "icu", "time-series", "polars", "fastapi", "cohort"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "polars>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "altair>=5.3"]
ai = ["openai>=1.50"]
report = ["vl-convert-python>=1.6"]
nlp-spacy = ["spacy>=3.7"]
nlp-gliner = ["gliner>=0.2.13"]
nlp-transformers = ["transformers>=4.40", "torch>=2.2"]
deid = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
pandas = ["pandas>=2.0", "pyarrow>=15"]
slurm = ["submitit>=1.5"]
all = ["dea[web,ai,report,pandas,slurm,nlp-spacy,deid]"]

[project.scripts]
dea = "dea.cli:main"

# `uv sync` installs the core plus this group; add extras with `uv sync --extra web --extra ai`
# or everything with `uv sync --all-extras`. With pip: `pip install -e ".[all]" --group dev`.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "playwright>=1.45"]

[project.urls]
Source = "https://github.com/DeastinY/diagnostic-expert-advisor"
Issues = "https://github.com/DeastinY/diagnostic-expert-advisor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dea"]

[tool.hatch.build.targets.wheel.force-include]
"src/dea/suggest/dictionary.yaml" = "dea/suggest/dictionary.yaml"
"src/dea/suggest/units.yaml" = "dea/suggest/units.yaml"
"frontend/dist" = "dea/static"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
