[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "dea"
version = "2.0.0a2"
description = "Diagnostic Expert Advisor: ingest, profile, visualize and analyze clinical time-series cohorts"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "Richard Polzin" }]
keywords = ["clinical", "icu", "time-series", "polars", "fastapi", "cohort"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=2.4.6",
  "polars>=2.0",
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
web = ["fastapi>=0.143.0", "uvicorn[standard]>=0.54.0", "python-multipart>=0.0.32", "altair>=6.3.0"]
ai = ["openai>=3.29.0"]
report = ["vl-convert-python>=1.9.0.post1"]
nlp-spacy = ["spacy>=3.8.16"]
nlp-gliner = ["gliner>=0.2.29"]
nlp-transformers = ["transformers>=5.19.0", "torch>=2.14.1"]
deid = ["presidio-analyzer>=2.2.364", "presidio-anonymizer>=2.2.364", "spacy>=3.8.16"]
pandas = ["pandas>=3.0.6", "pyarrow>=26.0.0"]
slurm = ["submitit>=1.5.4"]
all = ["dea[web,ai,report,pandas,slurm,nlp-spacy,deid]"]
dev = ["dea[all]", "pytest>=9.1.1", "ruff>=0.17.0", "httpx>=0.28.1"]

[project.scripts]
dea = "dea.cli:main"

[project.urls]
Source = "https://github.com/JRC-COMBINE/DEA"
Issues = "https://github.com/JRC-COMBINE/DEA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dea"]

[tool.hatch.build.targets.wheel.force-include]
"src/dea/suggest/dictionary.yaml" = "dea/suggest/dictionary.yaml"
"src/dea/suggest/units.yaml" = "dea/suggest/units.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
